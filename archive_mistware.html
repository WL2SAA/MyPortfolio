<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Discontinued</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for smooth UI animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- FontAwesome for minimalist icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for ambient synth audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mono: {
                            50: '#f4f4f5',
                            100: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            background-color: #050507;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            outline: none;
        }

        /* Glassmorphism containers with crisp monochrome borders */
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .white-glow {
            box-shadow: 0 0 30px -5px rgba(255, 255, 255, 0.15);
        }

        /* Subtle scanline overlay for retro digital feel */
        .scanline-overlay {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.12) 50%,
                rgba(0, 0, 0, 0.12)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Status dot pulsing indicator */
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
            50% { opacity: 0.3; transform: scale(0.8); box-shadow: 0 0 2px rgba(255,255,255,0.2); }
        }
        .animate-pulse-dot {
            animation: pulseDot 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .fade-in-up {
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-[#050507] text-mono-100 min-h-screen flex flex-col justify-between selection:bg-white/20 selection:text-white transition-colors duration-500 relative">

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Visual scanline texture -->
    <div class="scanline-overlay fixed inset-0 z-10 opacity-40"></div>

    <header class="relative z-20 w-full max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center text-white font-mono text-xs font-bold shadow-sm">
                ERR
            </div>
            <span class="font-mono text-xs tracking-widest text-mono-400 uppercase">Mistware: No Longer Maintained</span>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Audio Toggle -->
            <button id="audio-btn" title="Toggle Ambient Audio" class="p-2.5 rounded-xl glass-panel text-mono-400 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-volume-xmark text-sm w-4 h-4 flex items-center justify-center" id="audio-icon"></i>
            </button>

            <!-- 3D Render Mode Switcher -->
            <button id="style-btn" title="Toggle 3D View Mode" class="p-2.5 rounded-xl glass-panel text-mono-400 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-cubes text-sm w-4 h-4 flex items-center justify-center"></i>
            </button>

            <!-- Light/Dark Mode Toggle -->
            <button id="theme-btn" title="Toggle Theme" class="p-2.5 rounded-xl glass-panel text-mono-400 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-moon text-sm w-4 h-4 flex items-center justify-center" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <main class="relative z-20 w-full max-w-4xl mx-auto px-6 my-auto py-12 flex flex-col items-center text-center">
        
        <!-- Status Pill Badge -->
        <div class="inline-flex items-center space-x-2.5 px-4 py-1.5 rounded-full glass-panel border-white/20 text-mono-100 text-xs font-mono mb-8 white-glow fade-in-up">
            <span class="w-2 h-2 rounded-full bg-white animate-pulse-dot"></span>
            <span class="tracking-widest uppercase font-semibold">PROJECT ARCHIVED &bull; READ-ONLY</span>
        </div>

        <!-- Headline -->
        <h1 class="text-4xl md:text-6xl lg:text-7xl font-extralight tracking-tight text-white mb-6 leading-tight max-w-3xl fade-in-up" style="animation-delay: 0.1s;">
            Sorry, But This Project Is <span class="font-normal italic text-mono-300 underline decoration-white/40 underline-offset-8">No Longer Maintained</span>
        </h1>

        <!-- Subtitle -->
        <p class="text-base md:text-lg text-mono-400 font-normal max-w-2xl mb-10 leading-relaxed fade-in-up" style="animation-delay: 0.2s;">
            This repository and service have reached end-of-life. No further updates, feature requests, or security patches will be issued.
        </p>

        <!-- Action Controls -->
        <div class="flex flex-col sm:flex-row items-center gap-4 w-full justify-center max-w-md fade-in-up" style="animation-delay: 0.3s;">
            <a href="javascript:history.back()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-white hover:bg-mono-100 text-black font-semibold text-sm transition-all duration-300 shadow-lg shadow-white/10 flex items-center justify-center space-x-2 hover:-translate-y-0.5">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Go Back</span>
            </a>
            
            <!-- Replace YOUR_LINK_HERE with your target URL -->
            <a id="archive-btn" href="about:blank" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto px-6 py-3.5 rounded-xl glass-panel text-mono-200 hover:text-white font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 border border-white/10 hover:border-white/30 hover:-translate-y-0.5">
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-white"></i>
                <span>Archive Details</span>
            </a>

            <button id="share-btn" class="p-3.5 rounded-xl glass-panel text-mono-400 hover:text-white transition-all duration-300 border border-white/10 hover:border-white/30 flex items-center justify-center" title="Copy Notice Link">
                <i class="fa-solid fa-share-nodes text-sm"></i>
            </button>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 glass-panel border border-white/20 text-white px-5 py-2.5 rounded-xl text-xs font-mono flex items-center space-x-2 opacity-0 pointer-events-none transition-all duration-300 translate-y-4 shadow-2xl">
            <i class="fa-solid fa-check text-white"></i>
            <span id="toast-text">Notice link copied to clipboard</span>
        </div>
    </main>

    <script>
        // Global Three.js & Graphic Variables
        let scene, camera, renderer;
        let mainGroup, coreMesh, wireframeMesh, fragmentGroup;
        let neuronNodes = [], neuronConnectionsMesh;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        let currentMode = 0; // 0: Pure Mono Glass, 1: High Contrast Wireframe, 2: Solid Metallic White
        let isDarkTheme = true;

        // Sound generator via Tone.js
        let synth, filter, isAudioPlaying = false;

        function initThree() {
            const canvas = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050507, 0.03);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 11;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Pure Monochrome Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
            keyLight.position.set(5, 8, 5);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x888888, 1.0);
            fillLight.position.set(-5, -5, -2);
            scene.add(fillLight);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            createNeuronBackground();

            createMonochromeCore();

            // Mouse & touch dynamic tracking
            document.addEventListener('mousemove', onDocumentMouseMove);
            document.addEventListener('touchmove', onDocumentTouchMove, { passive: true });
            window.addEventListener('resize', onWindowResize);
        }

        function createNeuronBackground() {
            const nodeCount = 80;
            const bounds = 18;

            neuronNodes = [];
            const positions = [];

            for (let i = 0; i < nodeCount; i++) {
                const node = {
                    position: new THREE.Vector3(
                        (Math.random() - 0.5) * bounds,
                        (Math.random() - 0.5) * bounds,
                        (Math.random() - 0.5) * (bounds * 0.7)
                    ),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.008,
                        (Math.random() - 0.5) * 0.008,
                        (Math.random() - 0.5) * 0.008
                    )
                };
                neuronNodes.push(node);
            }

            // Create Point Particles for Neural Nodes
            const particleGeo = new THREE.BufferGeometry();
            const particlePos = new Float32Array(nodeCount * 3);

            for (let i = 0; i < nodeCount; i++) {
                particlePos[i * 3] = neuronNodes[i].position.x;
                particlePos[i * 3 + 1] = neuronNodes[i].position.y;
                particlePos[i * 3 + 2] = neuronNodes[i].position.z;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

            const particleMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.09,
                transparent: true,
                opacity: 0.8
            });

            const particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);
            particleSystem.name = "neuronParticles";

            // Lines container geometry
            const linesGeo = new THREE.BufferGeometry();
            const linesMat = new THREE.LineBasicMaterial({
                color: 0x888888,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending
            });

            neuronConnectionsMesh = new THREE.LineSegments(linesGeo, linesMat);
            scene.add(neuronConnectionsMesh);
        }

        function updateNeuronNetwork() {
            const linePositions = [];
            const maxDistance = 3.5;
            const particleSys = scene.getObjectByName("neuronParticles");
            const positions = particleSys ? particleSys.geometry.attributes.position.array : null;

            for (let i = 0; i < neuronNodes.length; i++) {
                const nodeA = neuronNodes[i];
                nodeA.position.add(nodeA.velocity);

                // Boundary bounce
                if (Math.abs(nodeA.position.x) > 10) nodeA.velocity.x *= -1;
                if (Math.abs(nodeA.position.y) > 10) nodeA.velocity.y *= -1;
                if (Math.abs(nodeA.position.z) > 8) nodeA.velocity.z *= -1;

                if (positions) {
                    positions[i * 3] = nodeA.position.x;
                    positions[i * 3 + 1] = nodeA.position.y;
                    positions[i * 3 + 2] = nodeA.position.z;
                }

                // Connect nearby nodes with neuron-like lines
                for (let j = i + 1; j < neuronNodes.length; j++) {
                    const nodeB = neuronNodes[j];
                    const dist = nodeA.position.distanceTo(nodeB.position);

                    if (dist < maxDistance) {
                        linePositions.push(
                            nodeA.position.x, nodeA.position.y, nodeA.position.z,
                            nodeB.position.x, nodeB.position.y, nodeB.position.z
                        );
                    }
                }
            }

            if (particleSys) particleSys.geometry.attributes.position.needsUpdate = true;

            neuronConnectionsMesh.geometry.dispose();
            neuronConnectionsMesh.geometry = new THREE.BufferGeometry();
            neuronConnectionsMesh.geometry.setAttribute(
                'position',
                new THREE.Float32BufferAttribute(linePositions, 3)
            );
        }

        function createMonochromeCore() {
            if (fragmentGroup) mainGroup.remove(fragmentGroup);

            fragmentGroup = new THREE.Group();

            // Core Geometric Icosahedron
            const coreGeo = new THREE.IcosahedronGeometry(1.7, 1);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0x18181b,
                roughness: 0.3,
                metalness: 0.9,
                wireframe: false
            });
            coreMesh = new THREE.Mesh(coreGeo, coreMat);
            fragmentGroup.add(coreMesh);

            // Crisp Wireframe Cage Overlay
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.35
            });
            wireframeMesh = new THREE.Mesh(coreGeo, wireMat);
            wireframeMesh.scale.setScalar(1.03);
            fragmentGroup.add(wireframeMesh);

            // Floating Disassembled Shards in Grey/White Glass
            const fragmentCount = 26;
            const fragmentGeo = new THREE.TetrahedronGeometry(0.32, 0);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                metalness: 0.2,
                roughness: 0.1,
                transmission: 0.8,
                transparent: true,
                opacity: 0.85,
                reflectivity: 1.0
            });

            for (let i = 0; i < fragmentCount; i++) {
                const fragment = new THREE.Mesh(fragmentGeo, glassMat);
                
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 2.6 + Math.random() * 1.6;

                fragment.position.x = r * Math.sin(phi) * Math.cos(theta);
                fragment.position.y = r * Math.sin(phi) * Math.sin(theta);
                fragment.position.z = r * Math.cos(phi);

                fragment.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                
                fragment.userData = {
                    basePos: fragment.position.clone(),
                    speed: 0.4 + Math.random() * 1.0,
                    rotSpeed: (Math.random() - 0.5) * 0.015
                };

                fragmentGroup.add(fragment);
            }

            // Concentric Outer Orbit Line Rings
            const ringGeo = new THREE.TorusGeometry(3.6, 0.012, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 });
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            ring1.rotation.x = Math.PI / 3;
            fragmentGroup.add(ring1);

            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.rotation.y = Math.PI / 4;
            fragmentGroup.add(ring2);

            mainGroup.add(fragmentGroup);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.0012;
            mouseY = (event.clientY - windowHalfY) * 0.0012;
        }

        function onDocumentTouchMove(event) {
            if (event.touches.length === 1) {
                mouseX = (event.touches[0].clientX - windowHalfX) * 0.0012;
                mouseY = (event.touches[0].clientY - windowHalfY) * 0.0012;
            }
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Smooth parallax easing
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            mainGroup.rotation.y = time * 0.12 + targetX * 2.2;
            mainGroup.rotation.x = targetY * 1.4;

            if (wireframeMesh) {
                wireframeMesh.rotation.y = -time * 0.18;
                wireframeMesh.scale.setScalar(1.03 + Math.sin(time * 2.2) * 0.02);
            }

            if (fragmentGroup) {
                fragmentGroup.children.forEach((child, index) => {
                    if (child.userData && child.userData.basePos) {
                        const pulse = Math.sin(time * child.userData.speed + index) * 0.18;
                        child.position.x = child.userData.basePos.x + pulse * 0.25;
                        child.position.y = child.userData.basePos.y + pulse * 0.25;
                        child.rotation.x += child.userData.rotSpeed;
                        child.rotation.y += child.userData.rotSpeed;
                    }
                });
            }

            // Update real-time 3D neuron line connections
            updateNeuronNetwork();

            renderer.render(scene, camera);
        }

        function setupUIInteractions() {
            // Theme Switcher (Dark Black vs Minimal Light Grey)
            const themeBtn = document.getElementById('theme-btn');
            const themeIcon = document.getElementById('theme-icon');

            themeBtn.addEventListener('click', () => {
                isDarkTheme = !isDarkTheme;
                if (isDarkTheme) {
                    document.documentElement.classList.remove('light');
                    document.body.style.backgroundColor = '#050507';
                    document.body.classList.replace('text-mono-900', 'text-mono-100');
                    themeIcon.className = 'fa-solid fa-moon text-sm';
                    scene.fog.color.setHex(0x050507);
                    if (neuronConnectionsMesh) neuronConnectionsMesh.material.color.setHex(0x888888);
                } else {
                    document.documentElement.classList.add('light');
                    document.body.style.backgroundColor = '#f4f4f5';
                    document.body.classList.replace('text-mono-100', 'text-mono-900');
                    themeIcon.className = 'fa-solid fa-sun text-sm text-mono-900';
                    scene.fog.color.setHex(0xf4f4f5);
                    if (neuronConnectionsMesh) neuronConnectionsMesh.material.color.setHex(0x333333);
                }
            });

            // 3D Render Mode Switcher
            const styleBtn = document.getElementById('style-btn');
            styleBtn.addEventListener('click', () => {
                currentMode = (currentMode + 1) % 3;

                gsap.to(mainGroup.scale, {
                    x: 0.1, y: 0.1, z: 0.1, duration: 0.35, onComplete: () => {
                        if (currentMode === 0) {
                            coreMesh.material.wireframe = false;
                            coreMesh.material.color.setHex(0x18181b);
                            wireframeMesh.visible = true;
                        } else if (currentMode === 1) {
                            coreMesh.material.wireframe = true;
                            coreMesh.material.color.setHex(0xffffff);
                            wireframeMesh.visible = false;
                        } else {
                            coreMesh.material.wireframe = false;
                            coreMesh.material.color.setHex(0xe4e4e7);
                            wireframeMesh.visible = true;
                        }

                        gsap.to(mainGroup.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: "back.out(1.7)" });
                    }
                });

                showToast(`3D Mode: ${currentMode === 0 ? 'Pure Mono Glass' : currentMode === 1 ? 'Wireframe Grid' : 'Metallic White Core'}`);
            });

            // Share Link Handler
            const shareBtn = document.getElementById('share-btn');
            shareBtn.addEventListener('click', () => {
                const url = window.location.href;
                const tempInput = document.createElement('input');
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);

                showToast('Archive notice URL copied to clipboard');
            });

            // Ambient Tone Audio Toggle
            const audioBtn = document.getElementById('audio-btn');
            const audioIcon = document.getElementById('audio-icon');

            audioBtn.addEventListener('click', async () => {
                if (!isAudioPlaying) {
                    await Tone.start();
                    
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 4, decay: 2, sustain: 0.9, release: 4 }
                    });
                    
                    filter = new Tone.Filter(200, "lowpass").toDestination();
                    synth.connect(filter);
                    synth.volume.value = -22;

                    // Play ambient drone chord (A Minor / Minimalist scale)
                    synth.triggerAttack(["A1", "E2", "A2", "C3"]);

                    isAudioPlaying = true;
                    audioIcon.className = "fa-solid fa-volume-high text-sm text-white";
                    showToast('Ambient monochrome audio activated');
                } else {
                    if (synth) synth.releaseAll();
                    isAudioPlaying = false;
                    audioIcon.className = "fa-solid fa-volume-xmark text-sm";
                    showToast('Ambient audio muted');
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');

            toastText.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2600);
        }

        window.onload = function () {
            initThree();
            animate();
            setupUIInteractions();
        };
    </script>
</body>
</html>
